<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет пациента | Доктор ЛОР</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0070f3; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #0070f3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .error { color: red; text-align: center; margin-top: 15px; font-weight: bold; }
        .record-card { border-left: 4px solid #0070f3; background: #f9f9f9; padding: 15px; margin-top: 15px; border-radius: 4px; }
        .record-date { font-weight: bold; color: #555; margin-bottom: 5px; }
        .hidden { display: none; }
        .logout-btn { background-color: #ff3b30; margin-top: 20px; }
        .logout-btn:hover { background-color: #d32f2f; }
        pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
    </style>
</head>
<body>

    <!-- ФОРМА ВХОДА -->
    <div id="login-block" class="container">
        <h2>Вход в личный кабинет</h2>
        <div class="form-group">
            <label for="patient-id">Номер пациента (ID):</label>
            <input type="number" id="patient-id" placeholder="Например: 1">
        </div>
        <div class="form-group">
            <label for="birth-date">Дата рождения:</label>
            <input type="text" id="birth-date" placeholder="Например: 01.04.2000">
        </div>
        <button onclick="login()">Войти</button>
        <div id="login-error" class="error"></div>
    </div>

    <!-- ОКНО ЛИЧНОГО КАБИНЕТА -->
    <div id="cabinet-block" class="container hidden">
        <h2 id="patient-title">Медкарта пациента</h2>
        <div id="records-list"></div>
        <button class="logout-btn" onclick="logout()">Выйти из кабинета</button>
    </div>

    <script>
        // КЛЮЧИ УСТАНОВЛЕНЫ СТРОГО НА СВОИ МЕСТА БЕЗ ЛИШНИХ ПРОБЕЛОВ
        const RAW_URL = "https://dptaczshbxmgtybmbnuw.supabase.co";
        const RAW_KEY = "sb_publishable_v9r0WuysY6zWfxke-7lQtQ_XegOBUHZ";

        // Автоматическая очистка строк от скрытых символов при копировании
        const SUPABASE_URL = RAW_URL.trim().replace(/[^\x00-\x7F]/g, "");
        const SUPABASE_KEY = RAW_KEY.trim().replace(/[^\x00-\x7F]/g, "");

        async function login() {
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerText = "";

            const id = document.getElementById('patient-id').value;
            const rawBirthDate = document.getElementById('birth-date').value.trim();
            const cleanBirthDate = rawBirthDate.replace(/\./g, ''); 

            if (!id || !cleanBirthDate) {
                errorDiv.innerText = "Пожалуйста, заполните все поля.";
                return;
            }

            try {
                // Прямой сетевой запрос к таблице в обход сторонних библиотек
                const targetUrl = SUPABASE_URL + "/rest/v1/patients_sync?select=*&id=eq." + parseInt(id);
                
                const response = await fetch(targetUrl, {
                    method: "GET",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY
                    }
                });

                if (!response.ok) {
                    errorDiv.innerText = "Ошибка сервера: " + response.status + " " + response.statusText;
                    return;
                }

                let data = await response.json();

                if (data && data.length > 0) {
                    // Фильтруем данные по слитной дате рождения (например, 01042000)
                    data = data.filter(record => {
                        return record.patient_name && record.patient_name.includes(cleanBirthDate);
                    });
                }

                if (data && data.length > 0) {
                    // Сортируем: свежие медицинские протоколы будут сверху
                    data.sort((a, b) => b.record_code - a.record_code);

                    document.getElementById('login-block').classList.add('hidden');
                    document.getElementById('cabinet-block').classList.remove('hidden');
                    
                    if (data && data[0] && data[0].patient_name) {
    // Берём ФИО из первого приёма и отрезаем дату рождения, чтобы на экране было чистое имя
    document.getElementById('patient-title').innerText = "Медкарта: " + data[0].patient_name.replace(/[0-9]/g, '').trim();
} else {
    document.getElementById('patient-title').innerText = "Медкарта пациента ID: " + id;
}


                    const listDiv = document.getElementById('records-list');
                    listDiv.innerHTML = "";

   data.forEach(record => {
    let text = record.doc_text || "";
    
    // Ищем, где в тексте начинается слово Диагноз
    const startDiag = text.indexOf("Диагноз:");
    
    if (startDiag !== -1) {
        // Ищем конец строки или абзаца, где написан сам диагноз
        // Проверяем все варианты переносов строк, которые генерирует Word
        let endDiag = text.indexOf("\n\n", startDiag);
        if (endDiag === -1) endDiag = text.indexOf("\r\n\r\n", startDiag);
        if (endDiag === -1) endDiag = text.indexOf("\n", startDiag);

        if (endDiag !== -1 && endDiag > startDiag) {
            // Вырезаем кусок от слова "Диагноз:" до конца этого абзаца
            const beforeDiag = text.substring(0, startDiag);
            const afterDiag = text.substring(endDiag);
            text = beforeDiag + "[Диагноз скрыт]" + afterDiag;
        } else {
            // Если переносов строк нет, просто убираем слово Диагноз до конца текста
            text = text.substring(0, startDiag) + "\n[Диагноз скрыт]";
        }
    }

    const card = document.createElement('div');
    card.className = 'record-card';
    card.innerHTML = `
        <div class="record-date">Прием от ${record.doc_date} (${record.doc_time})</div>
        <div class="record-text"><pre>${text}</pre></div>
    `;
    listDiv.appendChild(card);
});



                } else {
                    errorDiv.innerText = "Пациент не найден. Проверьте ID или Дату рождения.";
                }

            } catch (err) {
                errorDiv.innerText = "Ошибка сети: " + err.message;
            }
        }

        function logout() {
            document.getElementById('cabinet-block').classList.add('hidden');
            document.getElementById('login-block').classList.remove('hidden');
            document.getElementById('patient-id').value = "";
            document.getElementById('birth-date').value = "";
            document.getElementById('login-error').innerText = "";
        }
    </script>
</body>
</html>
