<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOR ALA — Официальный сайт</title>
    <!-- Подключаем Tailwind CSS через CDN (работает прямо из сети без установки) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex flex-col min-h-screen justify-between p-6">

    <!-- Главный блок (Шапка и Текст) -->
    <main class="max-w-2xl mx-auto text-center mt-20 space-y-6">
        <div class="inline-block bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase">
            Сайт успешно запущен
        </div>
        
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
            lor-ala.vercel.app
        </h1>
        
        <p class="text-slate-400 text-base md:text-lg max-w-md mx-auto leading-relaxed">
            Этот сайт написан на чистом HTML с использованием Tailwind CSS прямо со смартфона. Код готов к дальнейшему редактированию.
        </p>

        <div class="pt-4">
            <a href="https://github.com" target="_blank" class="inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition shadow-lg shadow-indigo-600/20 active:scale-95">
                Редактировать на GitHub
            </a>
        </div>
    </main>

    <!-- Подвал (Footer) -->
    <footer class="text-center text-xs text-slate-500 mt-20 border-t border-slate-800/60 pt-4">
        &copy; 2026 LOR ALA. Абсолютно бесплатно и без чужой рекламы.
    </footer>

</body>
</html>
